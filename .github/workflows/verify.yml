name: Verify security runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      # Garden content is external. This checks tooling, not production content.
      - name: Build source and dependencies
        run: docker build --pull --target build -t website-tests .
      - name: Typecheck
        run: docker run --rm website-tests pnpm run check
      - name: Build runtime
        run: docker build --pull --target runtime -t website-runtime .
      - name: Verify runtime TLS distrust
        run: docker run --rm -v "$PWD/scripts/check-node-tls.mjs:/check-node-tls.mjs:ro" website-runtime node /check-node-tls.mjs
